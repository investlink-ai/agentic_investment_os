[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "agentic-investment-os"
version = "0.1.0"
description = "Evidence-bound agentic investment research with deterministic risk and execution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Xiaobin Xu" }]
dependencies = []

[dependency-groups]
dev = [
  "hypothesis>=6.165.10",
  "mutmut>=3.7.0",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.uv]
default-groups = ["dev"]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_investment_os"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "EM",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "PT",
  "PTH",
  "PYI",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "COM812",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = [
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
]
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
  "--cov=agentic_investment_os",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agentic_investment_os"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mutmut]
source_paths = ["src"]
only_mutate = [
  "src/agentic_investment_os/adapters/sqlite_lifecycle.py",
  "src/agentic_investment_os/application/lifecycle.py",
  "src/agentic_investment_os/domain/*",
  "src/agentic_investment_os/entrypoints/configuration.py",
  "src/agentic_investment_os/entrypoints/lifecycle.py",
  "src/agentic_investment_os/portfolio/*",
  "src/agentic_investment_os/execution/*",
]
pytest_add_cli_args = [
  "-o",
  "addopts=--strict-config --strict-markers -ra",
]
pytest_add_cli_args_test_selection = [
  "tests/unit",
  "tests/integration",
  "tests/contract",
  "--ignore=tests/unit/test_agent_workflow_harness.py",
  "--ignore=tests/unit/test_unit_test_tier.py",
  "--ignore=tests/integration/test_agent_workflow_harness.py",
  "--ignore=tests/integration/test_issue_worktree_harness.py",
  "--ignore=tests/integration/test_unit_test_tier.py",
]
mutate_only_covered_lines = true
