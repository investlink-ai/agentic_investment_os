[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = [
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
]
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
  "--cov=agentic_investment_os",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=json:.coverage.json",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agentic_investment_os"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage_tiers]
schema_version = 1
package_root = "src/agentic_investment_os"
report = ".coverage.json"
overall_lines = 85
overall_branches = 80
critical_lines = 100
critical_branches = 100
safety_supporting_lines = 90
safety_supporting_branches = 85
critical_paths = [
  "adapters/sqlite_lifecycle.py",
  "application/governance.py",
  "application/lifecycle.py",
  "domain/governance.py",
  "domain/lifecycle.py",
  "domain/universe.py",
  "entrypoints/configuration.py",
  "execution/**/*.py",
  "memory/admission.py",
  "memory/reducer.py",
  "portfolio/**/*.py",
]
safety_supporting_paths = [
  "adapters/filesystem_evidence.py",
  "adapters/recorded_evidence.py",
  "adapters/recorded_model.py",
  "adapters/recorded_portfolio.py",
  "adapters/recorded_universe.py",
  "adapters/sqlite_lab.py",
  "adapters/sqlite_memory.py",
  "adapters/sqlite_portfolio.py",
  "application/replay.py",
  "domain/attention.py",
  "domain/identity.py",
  "domain/temporal.py",
  "evidence/attention.py",
  "evidence/capture.py",
  "entrypoints/lifecycle.py",
  "memory/beliefs.py",
  "entrypoints/governance.py",
  "entrypoints/lab.py",
  "research/dossier.py",
  "research/model.py",
  "research/resolution.py",
]

[tool.mutmut]
source_paths = ["src"]
only_mutate = [
  "src/agentic_investment_os/execution/__init__.py",
  "src/agentic_investment_os/memory/admission.py",
  "src/agentic_investment_os/memory/reducer.py",
  "src/agentic_investment_os/portfolio/__init__.py",
  "src/agentic_investment_os/portfolio/construction.py",
]
pytest_add_cli_args = [
  "-o",
  "addopts=--strict-config --strict-markers -ra",
]
pytest_add_cli_args_test_selection = [
  "tests/unit/test_beliefs.py",
  "tests/contract/test_belief_event_contract.py",
  "tests/unit/test_portfolio.py",
]
mutate_only_covered_lines = false

[tool.mutation_gate]
schema_version = 1
authority_roots = [
  "src/agentic_investment_os/execution",
  "src/agentic_investment_os/memory",
  "src/agentic_investment_os/portfolio",
]
noncritical_modules = ["src/agentic_investment_os/memory/beliefs.py"]
