name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static and coverage
            target: check-coverage
          - name: lifecycle state machine
            target: test-lifecycle-state-machine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --all-groups --frozen

      - name: Run repository gate leg
        run: make ${{ matrix.target }}

  check:
    name: make check
    needs: gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every gate leg
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: test "$GATE_RESULT" = success
